# Development environment configuration
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:easycloud;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

# Override MySQL-specific settings for H2 compatibility
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# 开发环境日志级别
logging:
  level:
    root: INFO
    com.easycloud: DEBUG
    org.springframework.web: INFO

jwt:
  # 开发环境留空：未提供 JWT_SECRET 时使用进程内临时随机密钥；生产必须通过环境变量 JWT_SECRET 提供（>=32 字节）
  secret: ${JWT_SECRET:}
  expiration: 86400000
